<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <caption>Menue</caption>

        <thead>
            <tr>
                <th rowspan="2">Item</th>
                <th colspan="2">Price</th>
            </tr>
            <th>IN</th>
            <th>US</th>
        </thead>

        <tbody>
            <tr>
                <td>Pizza</td>
                <td>100</td>
                <td>150</td>
            </tr>
            <tr>
                <td>Burger</td>
                <td>200</td>
                <td>550</td>
            </tr>
            <tr>
                <td>Pastry</td>
                <td>45</td>
                <td>98</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
