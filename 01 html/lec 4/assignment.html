<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Assignment</title>
</head>

<body>
    <h2 style="text-align: center;">Novel Services Login</h2>

    <form action="#">

        <label for="username">Username:</label>
        <input type="text" name="username" id="username">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password">

        <br><br>

        <label for="city of">City of Employment:</label>
        <input type="text" name="city" id="city of">

        <br><br>

<label for="web server">Web server:</label>
<select name="web server" id="web server">
    <option value="" selected>--Choose a server--</option>
    <option value="server1">Server 1</option>
    <option value="server2">Server 2</option>
    <option value="server3">Server 3</option>
</select>

<br><br>

<label for="role">Please specify your role:</label>
<input type="radio" name="role" value="Admin" id="role">
<label for="role">Admin</label>
<input type="radio" name="role" value="Engineer" id="role">
<label for="role">Engineer</label>
<input type="radio" name="role" value="Manager" id="role">
<label for="role">Manager</label>
<input type="radio" name="role" value="Guest" id="role">
<label for="role">Guest</label>

<br><br>

<label for="signon">Single Sign-on to the following:</label>
<input type="checkbox" name="mail" value="Mail" id="mail">
<label for="mail">Mail</label>
<input type="checkbox" name="roll" value="Playroll" id="roll">
<label for="roll">Playroll</label>
<input type="checkbox" name="service" value="Self-service" id="service">
<label for="service">Self-service</label>

<br><br>
<div style="text-align: center;">
        <button>Login</button> <button type="reset">Reset</button>
        </div>
    </form>
</body>

</html>
