<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Inputs</title>
</head>

<body>
    <h2>Job Application Form</h2>

    <form action="#">
        <label for="fullname">Full name</label>
        <input type="text" name="fullname" placeholder="Enter Fullname" id="fullname">

        <br><br>

        <label for="email">Email address</label>
        <input type="email" name="email" placeholder="Enter Email" id="email">

        <br><br>

        <label for="password">Password</label>
        <input type="password" name="password" placeholder="Enter Password" id="password" minlength="8" maxlength="12">

        <br><br>

        <label for="Phone">Phone number</label>
        <input type="tel" name="Phone" placeholder="Enter Phone Number" id="Phone" maxlength="10" minlength="10">

        <br><br>

        <label for="age">Age</label>
        <input type="number" name="age" placeholder="Enter Age" id="age" min="18" max="60">

        <br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" name="dob" id="dob">

        <br><br>

        <label for="image">Profile Image</label>
        <input type="file" name="image" id="image" accept=".png, .jpg, .jpeg">

        <br><br>

        <label for="gender">Gender</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" value="other" id="other">
        <label for="other">Other</label>

        <br><br>

        <label for="country">country</label>
        <select name="country" id="country">
            <option value="">Select Country</option>
            <option value="IN">India</option>
            <option value="US">United States</option>
        </select>

        <br><br>

        <input type="checkbox" name="terms" id="terms">
        <label for="terms">I agree to the terms and conditions</label>

        <br><br>

        <button>Submit</button>
    </form>
</body>

</html>
